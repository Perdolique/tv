packages:
  - apps/*
  - packages/*

saveExact: true

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sharp: false
  workerd: false

minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260927.1'
  - '@playwright/test@1.63.0'
  - playwright-core@1.63.0
  - playwright@1.63.0
  - '@cloudflare/vitest-plugin@1.3.0'
  - miniflare@5.20260926.0-alpha
  - wrangler@4.142.0
  - '@vueuse/core@15.0.0'
  - '@vueuse/metadata@15.0.0'
  - '@vueuse/shared@15.0.0'
