services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tv
      POSTGRES_PASSWORD: tv
      POSTGRES_USER: tv
    ports:
      - 127.0.0.1:5433:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U tv -d tv
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - tv-postgres-18:/var/lib/postgresql

volumes:
  tv-postgres-18:
