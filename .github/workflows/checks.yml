name: Checks

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - run: pnpm run format:check
      - run: pnpm run lint:markdown
      - run: pnpm run lint:oxlint

  typecheck:
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-typecheck-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - run: pnpm run test:typecheck

  unit:
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-unit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - run: pnpm run test:unit

  integration:
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-integration-${{ github.ref }}
      cancel-in-progress: true
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://tv:tv@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tv
          POSTGRES_PASSWORD: tv
          POSTGRES_USER: tv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tv -d tv"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - run: pnpm run test:integration

  e2e:
    runs-on: ubuntu-24.04
    concurrency:
      group: checks-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e:ci

  migration:
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.actor != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    needs:
      - lint
      - typecheck
      - unit
      - integration
      - e2e
    name: Database migration
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - name: Run database migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run db:migrate

  deploy:
    needs: migration
    concurrency:
      group: tv-workers-${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    uses: Perdolique/automations/.github/workflows/deploy.yml@v3
    with:
      artifact-path: apps/web/.output
      artifact-name: tv-workers
      build-command: build
      deploy-to-staging-command: deploy:staging
      deploy-to-production-command: deploy:production
    secrets:
      cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
